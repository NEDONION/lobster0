[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "miniclaw"
version = "0.1.0"
description = "A tiny self-hosted personal agent built with Python."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "MiniClaw contributors" }]
dependencies = [
  "httpx>=0.28,<1",
  "textual>=8.2,<9",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9",
]
feishu = [
  "lark-channel-sdk>=1.2,<2",
]
telegram = [
  "python-telegram-bot>=21,<23",
]
discord = [
  "discord.py>=2.4,<3",
]
channels = [
  "lark-channel-sdk>=1.2,<2",
  "python-telegram-bot>=21,<23",
  "discord.py>=2.4,<3",
]

[project.scripts]
miniclaw = "miniclaw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"miniclaw.storage" = ["schema.sql", "migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
