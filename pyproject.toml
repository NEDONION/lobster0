[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lobster0-agent"
dynamic = ["version"]
description = "A tiny self-hosted personal agent built with Python."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Lobster0 contributors" }]
dependencies = [
  "croniter>=6.2,<7",
  "httpx>=0.28,<1",
  # uv 提供的 python-build-standalone 解释器不自带时区数据库，也不会回退去读
  # 系统的 /usr/share/zoneinfo。纯净 Linux 服务器上 `lobster0 init` 因此会以
  # "heartbeat.timezone must be a valid IANA timezone" 直接失败——即使系统本身
  # 装了 tzdata 也一样。zoneinfo 会自动回退到这个纯 Python 包，故必须显式依赖。
  "tzdata>=2025.1",
  "textual>=8.2,<9",
]

[project.optional-dependencies]
dev = [
  "PyYAML>=6.0.2,<7",
  "ruff>=0.9",
]
feishu = [
  "lark-channel-sdk>=1.2,<2",
]
telegram = [
  "python-telegram-bot>=21,<23",
]
discord = [
  "discord.py>=2.4,<3",
]
channels = [
  "lark-channel-sdk>=1.2,<2",
  "python-telegram-bot>=21,<23",
  "discord.py>=2.4,<3",
]
all = [
  "lark-channel-sdk>=1.2,<2",
  "python-telegram-bot>=21,<23",
  "discord.py>=2.4,<3",
]

[project.scripts]
lobster0 = "lobster0.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "lobster0._version.__version__"}

[tool.setuptools.package-data]
"lobster0.storage" = ["schema.sql", "migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
