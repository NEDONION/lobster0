[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lobster0-agent"
dynamic = ["version"]
description = "A tiny self-hosted personal agent built with Python."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Lobster0 contributors" }]
dependencies = [
  "croniter>=6.2,<7",
  "httpx>=0.28,<1",
  "textual>=8.2,<9",
]

[project.optional-dependencies]
dev = [
  "PyYAML>=6.0.2,<7",
  "ruff>=0.9",
]
feishu = [
  "lark-channel-sdk>=1.2,<2",
]
telegram = [
  "python-telegram-bot>=21,<23",
]
discord = [
  "discord.py>=2.4,<3",
]
channels = [
  "lark-channel-sdk>=1.2,<2",
  "python-telegram-bot>=21,<23",
  "discord.py>=2.4,<3",
]
all = [
  "lark-channel-sdk>=1.2,<2",
  "python-telegram-bot>=21,<23",
  "discord.py>=2.4,<3",
]

[project.scripts]
lobster0 = "lobster0.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "lobster0._version.__version__"}

[tool.setuptools.package-data]
"lobster0.storage" = ["schema.sql", "migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
